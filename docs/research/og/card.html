<!doctype html>
<meta charset="utf-8">
<title>og</title>
<style>
  @font-face {
    font-family: "Inter Display";
    src: url("/fonts/InterDisplay-Medium.woff2") format("woff2");
    font-weight: 500;
  }
  @font-face {
    font-family: "Inter Display";
    src: url("/fonts/InterDisplay-Light.woff2") format("woff2");
    font-weight: 300;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    font-family: "Inter Display", system-ui, sans-serif;
    background: #f0f0f0;
    color: #1a1a1a;
    position: relative;
    overflow: hidden;
  }
  .bg { position: absolute; inset: 0; }
  .bg img { width: 100%; height: 100%; object-fit: cover; object-position: 72% 58%; }
  .wash {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, #f0f0f0 0%, #f0f0f0 54%, rgba(240,240,240,0) 88%);
  }
  .inner {
    position: relative;
    height: 100%;
    padding: 60px 68px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .lockup { display: flex; align-items: center; gap: 16px; }
  .tile {
    width: 52px; height: 52px; border-radius: 17px; background: #1a1a1a;
    display: flex; align-items: center; justify-content: center;
  }
  .word { font-size: 26px; font-weight: 500; letter-spacing: -0.04em; }
  h1 {
    font-size: 82px; line-height: 0.98; letter-spacing: -0.045em;
    font-weight: 500; max-width: 720px;
  }
  h1 .dim { color: rgba(26,26,26,0.4); }
  .foot { display: flex; flex-direction: column; align-items: flex-start; gap: 22px; }
  p {
    font-size: 20px; line-height: 1.45; font-weight: 300;
    letter-spacing: 0.01em; max-width: 480px; color: rgba(26,26,26,0.7);
  }
  .rule { display: flex; align-items: center; gap: 20px; width: 100%; margin-bottom: 36px; }
  .rule i { display: block; height: 1px; background: rgba(26,26,26,0.2); flex: 1; max-width: 300px; }
  .rule b {
    font-family: ui-monospace, monospace; font-size: 14px; font-weight: 400;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  .states {
    display: flex; align-items: center; gap: 18px; flex-shrink: 0;
    font-family: ui-monospace, monospace; font-size: 13px;
    letter-spacing: 0.05em; text-transform: uppercase; color: rgba(26,26,26,0.55);
  }
  .states span { display: flex; align-items: center; gap: 8px; }
  .dot { width: 11px; height: 11px; border-radius: 999px; }
  .dot.needs { background: #1a1a1a; }
  .dot.watch { box-shadow: inset 0 0 0 1.6px rgba(26,26,26,0.75); }
  .dot.done { box-shadow: inset 0 0 0 1px rgba(26,26,26,0.3); }
</style>
<div class="bg"><img src="/assets/PXNhr4LbXoJRWLAHfzNTYjvdR5Y.webp" alt=""></div>
<div class="wash"></div>
<div class="inner">
  <div class="lockup">
    <span class="tile">
      <svg width="30" height="30" viewBox="0 0 32 32" fill="none">
        <path d="M16 1.6 17.9 8.4 30.4 21.2 26.4 20.4 17.7 14.2 17.4 24.2 20.4 30.4 16 27.4 11.6 30.4 14.6 24.2 14.3 14.2 5.6 20.4 1.6 21.2 14.1 8.4Z" fill="#fff"/>
      </svg>
    </span>
    <span class="word">Peregrine Partners</span>
  </div>
  <div>
    <div class="rule"><b>Nine branches, run overnight</b><i></i></div>
    <h1><span class="dim">Software sold you tools.</span><br>We do the work.</h1>
  </div>
  <div class="foot">
    <p>Suppliers, books, roster, marketing, bookings, the phone — done between close and open. Nothing sends until you approve it.</p>
    <div class="states">
      <span><i class="dot needs"></i>Needs you</span>
      <span><i class="dot watch"></i>Watching</span>
      <span><i class="dot done"></i>Done</span>
    </div>
  </div>
</div>
